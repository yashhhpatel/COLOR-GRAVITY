name: color_gravity
description: "Color Gravity - a color + gravity arcade game for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  audioplayers: ^6.0.0
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  url_launcher_platform_interface: ^2.3.0
  plugin_platform_interface: ^2.1.0
  path_provider: ^2.1.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
